name: Deploy Market Scraper

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment while it is replacing the production container.
concurrency:
  group: market-scraper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.8.5'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src tests
      - name: Check shell scripts
        run: |
          bash -n run_app.sh
          sh -n scripts/deploy.sh
          shellcheck run_app.sh scripts/deploy.sh
      - name: Build production image
        run: docker build --tag mexc-market-scraper:${{ github.sha }} .

  deploy:
    name: Deploy to Remote Server
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy and verify scanner health
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          MIN_GAIN_PERCENT: 70
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          envs: DEPLOY_SHA,TG_BOT_TOKEN,MIN_GAIN_PERCENT
          command_timeout: 15m
          script_path: scripts/deploy.sh
