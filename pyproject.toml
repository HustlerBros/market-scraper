[project]
name = "market-scraper"
version = "0.1.0"
requires-python = ">=3.12"
description = "A market data scraper"
dependencies = [
    "requests",
    "python-telegram-bot[job-queue]==20.7"
    "prometheus-client>=0.20.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff"
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
